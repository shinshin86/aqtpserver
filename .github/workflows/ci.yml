name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Check installer syntax
        if: runner.os == 'macOS'
        run: bash -n install.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
